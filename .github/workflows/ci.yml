name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  tests:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, python: "3.8" }
          - { os: ubuntu-latest, python: "3.9" }
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.12" }
          - { os: windows-latest, python: "3.11" }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install rclone (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rclone

      - name: Install rclone (macOS)
        if: runner.os == 'macOS'
        run: brew install rclone

      - name: Install rclone (Windows)
        if: runner.os == 'Windows'
        run: choco install rclone -y --no-progress

      - name: Show versions
        run: |
          python --version
          rclone version

      - name: Byte-compile every script
        run: python -m compileall -q scripts

      - name: selftest.py — end-to-end story
        run: python scripts/selftest.py

      - name: crud_test.py — independent CRUD checks
        run: python scripts/crud_test.py

      - name: edge_test.py — pathological inputs
        run: python scripts/edge_test.py

      - name: menu.py — rendering self-check
        run: python scripts/menu.py --self-check

  package:
    name: build & install the package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Install the wheel and run the console commands
        run: |
          python -m pip install dist/*.whl
          skill-sync --help
          skill-sync doctor --json || true
          python -c "import skill_sync.sync as s; print('version:', s.local_version())"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
